name: CI

# ─── WIP: Auto-triggers disabled during active development ────────────────────
# CI will NOT run on push or PR while the codebase is being built out.
# Re-enable the push/pull_request triggers on Day 13 before final submission.
#
# To run CI manually right now:
#   GitHub → Actions tab → CI → "Run workflow" button
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running CI manually?"
        required: false
        default: "Manual check"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check engine/ tests/
      - run: mypy engine/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/unit/ -v --cov=engine --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

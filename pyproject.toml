[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "intent-engine"
version = "0.1.0"
description = "AI-Based System Intent Engine for Safe Linux Command Execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Harshit", email = "" },
  { name = "Praveen", email = "" },
  { name = "Vansh", email = "" },
]
keywords = ["linux", "shell", "safety", "ai", "llm", "command-interception"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "toml>=0.10.2",
  "structlog>=24.1.0",
  "httpx>=0.27.0",
  "rich>=13.7.0",
  "click>=8.1.7",
  "psutil>=5.9.8",
]

[project.optional-dependencies]
llm-ollama = ["ollama>=0.2.0"]
llm-gemini = ["google-generativeai>=0.7.0"]
llm-openai = ["openai>=1.30.0"]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[project.scripts]
intent-engine = "engine.cli:main"
intent-daemon = "engine.daemon.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "rules*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=engine --cov-report=term-missing --tb=short -v"
